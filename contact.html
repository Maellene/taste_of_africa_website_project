<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Tastes of Africa</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Site header and navigation -->
<header class="site-header">
  <a class="logo" href="index.html">Tastes of Africa</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="recipes.html">Recipes</a>
    <a href="regions.html">Regions</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <button id="theme-toggle" aria-label="Switch to dark mode">🌙 Dark mode</button>
  </nav>
</header>

<main>
  <section class="container">
    <h1>Contact Us</h1>

    <!-- Contact form (validated with JavaScript) -->
    <form id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="country">Country</label>
      <select id="country" required>
        <option value="">Choose...</option>
        <option>Rwanda</option>
        <option>Nigeria</option>
        <option>Morocco</option>
        <option>Other</option>
      </select>

      <!-- Input with datalist suggestions -->
      <label for="dish">Favorite dish (suggestions)</label>
      <input type="text" id="dish" list="dishes">
      <datalist id="dishes">
        <option value="Jollof Rice">
        <option value="Tagine">
        <option value="Isombe">
      </datalist>

      <label for="message">Message</label>
      <textarea id="message" rows="5" required></textarea>
      <p id="error" class="error" hidden></p>

      <button type="submit">Send</button>
    </form>

    <!-- Shown after a successful submit -->
    <p id="confirmation" class="confirmation" hidden></p>
  </section>
</main>

<!-- Footer with newsletter signup -->
<footer class="site-footer">
  <p> 2026 Tastes of Africa</p>
  <form id="newsletter" class="newsletter">
    <label for="news-email">Newsletter:</label>
    <input type="email" id="news-email" placeholder="you@email.com" required>
    <button type="submit">Subscribe</button>
  </form>
</footer>

<script src="script.js"></script>
</body>
</html>
